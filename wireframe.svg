  <rect x="350" y="250" width="70" height="26" rx="6" fill="#2b2f36"/>
  <text x="385" y="267" font-size="11" fill="#ffffff" text-anchor="middle">Code</text>
  <rect x="426" y="250" width="70" height="26" rx="6" fill="#eef1f5" stroke="#d9dce1"/>
