  <circle cx="1000" cy="124" r="3" fill="#ff6058"/><circle cx="1012" cy="124" r="3" fill="#ffbd2e"/><circle cx="1024" cy="124" r="3" fill="#28c840"/>
  <rect x="1040" y="118" width="356" height="12" rx="6" fill="#ffffff" stroke="#d9dce1"/>
